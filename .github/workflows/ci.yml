name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  llms-full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify llms-full.txt is current
        run: python3 scripts/build-llms-full.py --check
